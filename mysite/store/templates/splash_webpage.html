<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Django App</title>
    <style>
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #main-content {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Splash screen -->
    <div id="splash-screen">
        <h2>🔄 Loading your experience...</h2>
    </div>

    <!-- Main content -->
    <div id="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        // После загрузки страницы — скрываем splash и показываем основное
        window.addEventListener('load', () => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        });
    </script>
</body>
</html>
